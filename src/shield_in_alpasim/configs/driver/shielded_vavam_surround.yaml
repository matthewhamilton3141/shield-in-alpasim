# driver=shielded_vavam_surround — the shield wrapping VaVAM, perceiving from the 4-camera
# surround rig instead of the front camera alone.
#
# Identical to shielded_vavam.yaml except `inference.use_cameras` advertises ALL FOUR cameras, so
# AlpaSim renders + delivers the sides and rear. The shield's camera obstacle source fuses all
# four into one rig-frame occupancy field (covering lateral/rear threats the front-only arm was
# blind to, docs/MULTICAM_HANDOFF.md); VaVAM, the inner policy, is still handed only its one front
# camera (SHIELD_POLICY_CAMERAS in shielded_vavam_surround_configs.yaml).
#
# ── Box prerequisites (same as shielded_vavam.yaml) ──────────────────────────────────────
#   1. VaVAM assets in data/drivers/vavam/ (public, ~1.3 GB, checksummed).
#   2. Arm the shield: export SHIELD_SCENE_USDZ_IN_CONTAINER=/mnt/nre-data/all-usdzs/<scene>.usdz.
#   Surround perception defaults on (SHIELD_OBSTACLE_SOURCE=camera). Set SHIELD_DEPTH_BATCH=1 to
#   batch the 4 depth passes; SHIELD_DEBUG_DIR=<path> to dump per-cycle BEV npz.
# ────────────────────────────────────────────────────────────────────────────────────────

defaults:
  - shielded_vavam_surround_configs   # 4-camera rig + the driver-container wiring (global)
  - _self_                            # values here win over the composed config

log_level: ${wizard.log_level}

model:
  model_type: shielded       # the OUTER model is the shield; it wraps VaVAM
  checkpoint_path: "/mnt/drivers/vavam/VAM_width_768_pretrained_139k.pt"
  device: "cuda"             # VaVAM runs on GPU; the shield ignores this
  tokenizer_path: "/mnt/drivers/vavam/VQ_ds16_16384_llamagen_encoder.jit"

host: "0.0.0.0"
port: ???

inference:
  # Advertise all four so AlpaSim renders + delivers them for the shield's surround perception.
  # VaVAM only consumes the front one (SHIELD_POLICY_CAMERAS); the driver filters the rest out
  # before calling it so its `_validate_cameras` passes (driver.py `_policy_input`).
  use_cameras:
    - camera_cross_left_120fov
    - camera_front_wide_120fov
    - camera_cross_right_120fov
    - camera_rear_left_70fov
  max_batch_size: 32
  subsample_factor: 1
  context_length: 1

route:
  default_command: 2         # 0=right, 1=left, 2=straight
  use_waypoint_commands: true
  command_distance_threshold: 3.0
  min_lookahead_distance: 20.0

output_dir: "/mnt/output/driver"

# Off: the shield's output is already certified against its own dynamics; re-smoothing it
# downstream would invalidate that certificate.
trajectory_optimizer:
  enabled: false

plot_debug_images: false
